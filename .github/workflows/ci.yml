name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install just
        uses: extractions/setup-just@v2

      - name: Lint shell scripts
        run: just lint

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run bats suite
        run: just test

  bash-3-2:
    # Runs the full bats suite under Bash 3.2 (the macOS system bash).
    # The macos-latest job above uses brew's modern Bash via
    # #!/usr/bin/env bash, so it doesn't catch 3.2-vs-5.x divergence.
    # This container does.
    runs-on: ubuntu-latest
    container:
      image: bash:3.2
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: apk add --no-cache bats jq
      # project-standards: allow ci-inline — minimal Alpine container
      # Deliberately calls bats directly rather than `just test`: this job
      # runs in a minimal Alpine container whose whole point is the old
      # Bash, and installing just there would add a failure mode without
      # changing what runs. The command is identical to the recipe body.
      - name: Run bats suite
        run: bats tests/
