name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          find dispatch.sh examples -name '*.sh' -print0 \
            | xargs -0 shellcheck

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Run bats suite
        run: bats tests/

  bash-3-2:
    # Runs the full bats suite under Bash 3.2 (the macOS system bash).
    # The macos-latest job above uses brew's modern Bash via
    # #!/usr/bin/env bash, so it doesn't catch 3.2-vs-5.x divergence.
    # This container does.
    runs-on: ubuntu-latest
    container:
      image: bash:3.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: apk add --no-cache bats jq
      - name: Run bats suite
        run: bats tests/
